<!DOCTYPE html>
<html>
<head>
    <title>Daily Quest Log</title>
    <style>
    body { 
        background: radial-gradient(circle at center, #1a1a2e, #0d0221); 
        color: #e0e0e0; 
        font-family: 'Segoe UI', sans-serif; 
        display: flex; 
        justify-content: center; 
        padding: 40px; 
        transition: 0.8s;
    }
    .ui-frame { 
        background: rgba(255, 255, 255, 0.03); /* Translucent glass */
        backdrop-filter: blur(15px); /* Frost effect */
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 24px; /* Rounded corners feel more 'human' */
        padding: 30px; 
        width: 380px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .stat-box { 
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        margin: 15px 0; 
        padding: 15px; 
        border-left: 4px solid #7000ff; /* A pop of color */
    }
    .btn { 
        display: block; 
        background: #7000ff; 
        color: white; 
        text-decoration: none; 
        padding: 12px; 
        text-align: center; 
        margin-top: 10px; 
        border-radius: 12px;
        font-weight: 500;
        transition: 0.3s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(112, 0, 255, 0.4); }
</style>

</head>
<body>

    <div class="ui-frame">
      <div style="font-size: 10px; margin-bottom: 5px; color: #7000ff;">AURA LEVEL: <span id="aura-lv">1</span></div>
<div style="width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; margin-bottom: 20px;">
    <div id="aura-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #7000ff, #00f0ff); transition: 1s;"></div>
</div>

<script>
    let progress = 0;
    let level = 1;
    setInterval(() => {
        progress += 5;
        if(progress > 100) {
            progress = 0;
            level++;
          level++;
localStorage.setItem('auraLevel', level); // This locks the level into the browser's memory

            document.getElementById('aura-lv').innerText = level;
            // Secret Reward: Pet celebrates your level up!
            document.getElementById('pet-talk').innerText = "LEVEL UP! Aura is looking strong, bruh.";
        }
        document.getElementById('aura-bar').style.width = progress + "%";
    }, 5000); // Fills a bit every 5 seconds
</script>
 
      <div class="stat-box" style="text-align:center;">
    <h3>👾 COMPANION</h3>
    <pre id="pet">( ^_^) </pre> 
    <p id="pet-talk">"Ready for the grind?"</p>
    <button class="btn" onclick="document.getElementById('pet').innerText = '( >_<)'; document.getElementById('pet-talk').innerText = 'Ouch! Stop clicking me!';">DON'T POKE</button>
          <button class="btn" style="background: #555; color: white;" onclick="toggleFocus()">🌑 TOGGLE VOID MODE</button>

<script>
function toggleFocus() {
    const frame = document.querySelector('.ui-frame');
    const petTalk = document.getElementById('pet-talk');
    
    if (frame.style.filter === 'grayscale(100%) brightness(0.7)') {
        frame.style.filter = 'none';
        petTalk.innerText = "Welcome back to the chaos.";
    } else {
        frame.style.filter = 'grayscale(100%) brightness(0.7)';
        petTalk.innerText = "Quiet mode active. Go be great, bruh.";
    }
}

</script>

</div>

      <h1>Alex's Notes</h1>

        <!-- 🎒 INVENTORY: YOUR FAV SITES -->
        <div class="stat-box">
            <h3>🎒 INVENTORY</h3>
            <p>Gear up with your links:</p>
            <a href="https://youtube.com" class="btn">⚔️ WATCH STREAMS</a>
            <a href="https://discord.gg" class="btn">🛡️ Discord HQ</a>
        <button class="btn" onclick="alert('You found 50 Gold!')">🎁 OPEN LOOT CRATE</button>
          <button class="btn" style="background: #00ff88;" onclick="document.body.style.background = '#330000'; document.querySelector('.ui-frame').style.borderColor = '#ff0000';">🔥 ENTER RAGE MODE</button>
          <button class="btn" style="background: #48cae4;" onclick="document.body.style.background = '#0d0221'; document.querySelector('.ui-frame').style.borderColor = '#7000ff';">👤 STEALTH MODE (RESET)</button>


<div class="stat-box">
    <h3>🎲 DAILY BUFF</h3>
    <p id="buff-text">Click the button for a random stat boost...</p>
    <button class="btn" onclick="const buffs=['+10 Coding Wisdom','+5 Productivity Aura','+20 Social Battery']; document.getElementById('buff-text').innerText = buffs[Math.floor(Math.random()*buffs.length)];">GET BUFF</button>
</div>

        </div>

        <!-- 📜 ACTIVE QUESTS: TO-DO LIST -->
        <div class="stat-box">
      
    <h3>📜 MAIN QUEST</h3>
    <div id="quest-item" style="display: flex; justify-content: space-between; align-items: center;">
        <span id="quest-text" contenteditable="true" onfocus="if(this.innerText==='Type your goal here...') this.innerText=''" onblur="if(this.innerText==='') this.innerText='Type your goal here...'">Type your goal here...</span>

        <button onclick="finishQuest()" style="background:#00ff88; border:none; cursor:pointer;">✅</button>
    </div>
</div>

<script>
    function finishQuest() {
        document.getElementById('quest-item').style.opacity = "0.3"; // Fades it out
        document.getElementById('pet-talk').innerText = "QUEST COMPLETE! +50 XP";
        document.getElementById('pet').innerText = "( >‿<)"; // Happy face
        alert("Quest Cleared! Your brain just got +1 Dopamine.");
    }
</script>

        <!-- 📊 PLAYER STATS -->
        <div class="stat-box">
            <h3>📊 ENERGY LEVELS</h3>
            <label>HP: </label>
            <meter value="0.7"></meter> <!-- Change 0.7 to 1.0 for full HP -->
        </div>

        <footer style="font-size: 10px; text-align: center;">PRESS CTRL+S TO SAVE YOUR PROGRESS</footer>
    </div>
<script>
    <script>
    // --- 1. GLOBAL VARIABLES ---
    let level = localStorage.getItem('auraLevel') ? parseInt(localStorage.getItem('auraLevel')) : 1;
    let progress = 0;

    // --- 2. THE HEARTBEAT (PET & AURA) ---
    setInterval(() => {
        const pet = document.getElementById('pet');
        const petTalk = document.getElementById('pet-talk');
        const auraBar = document.getElementById('aura-bar');
        
        // Pet Faces
        const faces = ['( ^_^)', '( -_-)', '( o_o)', '( ^_^)'];
        pet.innerText = faces[Math.floor(Math.random() * faces.length)];
        
        // Random "Bruh" Quotes
        if(Math.random() > 0.85) {
            const lines = ["Bruh.", "I'm not lazy, I'm energy-efficient.", "First person to say 'bruh' was a legend.", "Loading motivation... 404.", "Current status: Unbothered."];
            petTalk.innerText = lines[Math.floor(Math.random() * lines.length)];
        }

        // Aura Leveling Logic
        progress += 5;
        if(progress > 100) {
            progress = 0;
            level++;
            document.getElementById('aura-lv').innerText = level;
            localStorage.setItem('auraLevel', level);
            petTalk.innerText = "LEVEL UP! Aura is strong, bruh.";
        }
        auraBar.style.width = progress + "%";
    }, 5000);

    // --- 3. LOOT & QUEST ACTIONS ---
    function findLoot() {
        const items = ["💎 Rare Diamond", "🍕 Unlimited Pizza", "🎸 Rockstar Guitar", "👑 Golden Crown"];
        const found = items[Math.floor(Math.random() * items.length)];
        document.getElementById('inventory-item').innerText = "Found: " + found;
        localStorage.setItem('savedLoot', found);
    }

    function finishQuest() {
        document.getElementById('quest-item').style.opacity = "0.3";
        document.getElementById('pet-talk').innerText = "QUEST COMPLETE! +50 XP";
        document.getElementById('pet').innerText = "( >‿<)";
    }

    function toggleFocus() {
        const frame = document.querySelector('.ui-frame');
        frame.style.filter = (frame.style.filter === 'grayscale(100%) brightness(0.7)') ? 'none' : 'grayscale(100%) brightness(0.7)';
    }

    // --- 4. STARTUP (LOAD FROM DISK) ---
    window.onload = () => {
        // Load Quest
        const savedQuest = localStorage.getItem('savedQuest');
        if (savedQuest) document.getElementById('quest-text').innerText = savedQuest;

        // Load Level
        document.getElementById('aura-lv').innerText = level;

        // Load Loot
        const savedLoot = localStorage.getItem('savedLoot');
        if (savedLoot) document.getElementById('inventory-item').innerText = "Found: " + savedLoot;

        // Check Day/Night
        const hour = new Date().getHours();
        if (hour >= 20 || hour < 6) {
            document.body.style.background = "radial-gradient(circle, #050505, #12002b)";
        }
    };

    // Save quest as you type
    document.getElementById('quest-text').addEventListener('input', () => {
        localStorage.setItem('savedQuest', document.getElementById('quest-text').innerText);
    });
</script>

</body>
</html>
